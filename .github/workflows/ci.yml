name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        env:
          MONGO_INITDB_ROOT_USERNAME: ci_user
          MONGO_INITDB_ROOT_PASSWORD: ci_password
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet mongodb://ci_user:ci_password@localhost:27017/admin?authSource=admin --eval 'db.adminCommand({ping: 1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend-app
    env:
      PORT: 3000
      MONGODB_URL: mongodb://ci_user:ci_password@localhost:27017/certificates?authSource=admin
      JWT_SECRET: ci-only-test-secret-that-is-not-used-in-production
      JWT_EXPIRES: 1d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend-app/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint:check
      - run: npm run build
      - run: npm test -- --runInBand
      - run: npm run test:e2e -- --runInBand

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: printf 'API_URL=http://localhost:3000\n' > .env
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
